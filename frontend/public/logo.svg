<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06261d" />
      <stop offset="50%" stop-color="#0b382c" />
      <stop offset="100%" stop-color="#041812" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Gold Gradient -->
    <linearGradient id="gold-soft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield / Shamsah Tile -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="2.5" />

  <!-- Inner Delicate Girih / Islamic Rosette Octagon Frame -->
  <rect x="14" y="14" width="92" height="92" rx="22" fill="none" stroke="#fbbf24" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="3 3" />

  <!-- Stylized Mehrab Arch Curve -->
  <path d="M36 82V52C36 38.7452 46.7452 28 60 28C73.2548 28 84 38.7452 84 52V82" 
        stroke="url(#gold-soft)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Acoustic Vocal Soundwaves forming an inner lotus/shamsah resonance -->
  <!-- Center Micro-Dome & Peak Wave -->
  <path d="M60 24C60 24 64 36 64 42C64 44.2091 62.2091 46 60 46C57.7909 46 56 44.2091 56 42C56 36 60 24 60 24Z" 
        fill="url(#gold-grad)" filter="url(#glow)" />

  <!-- Symmetrical Soundwave Equalizer Bars (Vocal Resonance) -->
  <!-- Central Column / Mic Core -->
  <rect x="58" y="50" width="4" height="28" rx="2" fill="url(#gold-grad)" />
  
  <!-- Left Columns -->
  <rect x="51" y="56" width="3.5" height="18" rx="1.75" fill="url(#gold-soft)" opacity="0.9" />
  <rect x="44" y="62" width="3.5" height="10" rx="1.75" fill="url(#gold-soft)" opacity="0.75" />
  <rect x="37" y="66" width="3" height="5" rx="1.5" fill="url(#gold-soft)" opacity="0.5" />

  <!-- Right Columns -->
  <rect x="65.5" y="56" width="3.5" height="18" rx="1.75" fill="url(#gold-soft)" opacity="0.9" />
  <rect x="72.5" y="62" width="3.5" height="10" rx="1.75" fill="url(#gold-soft)" opacity="0.75" />
  <rect x="80" y="66" width="3" height="5" rx="1.5" fill="url(#gold-soft)" opacity="0.5" />

  <!-- Base Decorative Base / Acoustic Cradle -->
  <path d="M42 82C42 85 50 88 60 88C70 88 78 85 78 82" 
        stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="94" r="2.5" fill="url(#gold-grad)" />

  <!-- Top Shamsah Star Ornament -->
  <circle cx="60" cy="18" r="2" fill="#fde68a" />
</svg>
